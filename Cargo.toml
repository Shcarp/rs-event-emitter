[package]
name = "rs-event-emitter"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "simulate promise implementation for rust"
repository = "https://github.com/Shcarp/rs-event-emitter.git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
threadpool = "1.8.1"
num_cpus = "1.16.0"
all_tuples = { path = "all_tuples", version = "0.1.0" }
uuid = { version = "1.3", features = ["v4"] }

runtime = { path = "runtime", optional = true, version = "0.1.0" }
futures = { version = "0.3.30", optional = true }
parking_lot = { version = "0.12.3", optional = true }
thiserror = "1.0.63"

[dev-dependencies]
tokio = { version = "1.39.3", features = ["full"] }

[features]
default = ["sync"]
sync = []
async = ["dep:runtime", "dep:futures", "dep:parking_lot"]
tokio_runtime = ["async", "runtime?/tokio_runtime"]

[workspace]
   members = [
       "all_tuples",
       "runtime",
   ]

